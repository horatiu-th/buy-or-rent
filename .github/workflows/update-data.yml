name: Update data

on:
  schedule:
    # Mondays 12:00 UTC. BNR is reported to publish the day's reference rate around 13:00
    # Bucharest time (10:00 or 11:00 UTC depending on daylight saving), so this reads that
    # day's rate. Scheduled runs can start late, never early.
    - cron: '0 12 * * 1'
  workflow_dispatch:

# Read-only unless a job asks for more. Only the job that opens the pull request can write,
# and it runs no project code or npm packages.
permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
      stale: ${{ steps.fetch.outputs.stale }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No install scripts: esbuild and rolldown ship their binaries as platform packages,
      # so the tools work without them.
      - run: npm ci --ignore-scripts
      - id: fetch
        run: npm run data:fetch
      - run: npm run data:merge
      - run: npm test
      - if: steps.fetch.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data-update
          path: |
            data/auto.json
            src/data/defaults.json
            pipeline-summary.md
          if-no-files-found: error
          retention-days: 5

  pull-request:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # create-pull-request sets up its own credentials from its token input.
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: data-update
      # A PR rather than a direct push, so a broken source can't silently change live numbers.
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: data/auto-update
          title: 'chore: Updated data'
          commit-message: 'chore: Updated data'
          body-path: pipeline-summary.md
          add-paths: |
            data/auto.json
            src/data/defaults.json

  # A failed fetch alone only leaves a warning annotation. Once a value is past its maximum age,
  # the run fails so the repository owner is notified.
  stale-alert:
    needs: [fetch, pull-request]
    if: always() && needs.fetch.result == 'success' && needs.fetch.outputs.stale == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "::error title=Stale data::A fetched value is older than its fetcher allows. See the fetch job summary."
          exit 1
